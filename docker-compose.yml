version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 15 Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: nirma_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_calls}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_calls}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 Cache & Celery Task Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nirma_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Local Ollama LLM Inference Engine (NVIDIA GPU Passthrough)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: nirma_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ----------------------------------------------------------------------------
  # FastAPI ASGI Core Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirma_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - audio_cache:/tmp/audio_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Task Worker
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirma_celery_worker
    restart: always
    command: celery -A backend.scheduler.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - audio_cache:/tmp/audio_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Celery Beat Periodic Task Dispatcher
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirma_celery_beat
    restart: always
    command: celery -A backend.scheduler.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy & TLS Termination
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nirma_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - audio_cache:/tmp/audio_cache:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  audio_cache:
    driver: local
